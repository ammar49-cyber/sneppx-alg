name: CI — Main Branch

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pre-commit system deps
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format shellcheck 2>&1 | tail -5
          npm install -g markdownlint-cli 2>&1 | tail -3
      - uses: pre-commit/action@v3.0.0
        continue-on-error: true

  build:
    name: Build All Targets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps (required by CMake)
        shell: bash
        run: pip install numpy
      - name: Configure
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DSNEPPX_BUILD_TESTS=ON \
            -DSNEPPX_BUILD_PYTHON=ON \
            -DSNEPPX_BUILD_BENCHMARKS=ON
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }}

  test:
    name: Full Test Suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy pytest pytest-timeout
      - name: Configure & Build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_PYTHON=ON
          cmake --build build --config Release
      - name: ctest
        working-directory: build
        run: ctest -C Release --output-on-failure
      - name: Python tests
        shell: bash
        run: |
          export PYTHONPATH="$PWD/bindings/python"
          python -m pytest tests/python/ -v --timeout=60 -x || true
      - name: Run benchmarks
        working-directory: build
        run: ctest -C Release -R "bench" --output-on-failure || true

  security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy bandit
      - name: Run bandit
        run: bandit -r bindings/python/ -ll || true
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp, python
      - name: Build for CodeQL
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON
          cmake --build build --config Debug
      - uses: github/codeql-action/analyze@v3
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  package:
    name: Build Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy build
      - name: Build Python wheel
        shell: bash
        run: python -m build --wheel --sdist
      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/
      - name: Verify wheel installs
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "from SneppX_ALG import Tensor; print('Package OK')"
