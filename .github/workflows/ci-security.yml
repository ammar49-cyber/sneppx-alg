name: CI — Security Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'security/**'
      - 'include/neural_core/security/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pre-commit system deps
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format shellcheck 2>&1 | tail -5
          npm install -g markdownlint-cli 2>&1 | tail -3
      - uses: pre-commit/action@v3.0.0
        continue-on-error: true

  build:
    name: Build All (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy
      - name: Configure with sanitizers
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DSNEPPX_BUILD_TESTS=ON \
            -DSNEPPX_BUILD_PYTHON=ON \
            -DSNEPPX_USE_ASAN=ON
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }}
      - name: Check for warnings
        shell: bash
        run: |
          cmake --build build --config ${{ matrix.config }} 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "Found warnings in build:"
            grep "warning:" build.log || true
          fi

  crypto-tests:
    name: Crypto Test Suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy
      - name: Configure & Build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON
          cmake --build build --config Debug
      - name: Run crypto tests
        working-directory: build
        run: ctest -C Debug --output-on-failure || true

  security-scan:
    name: Deep Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy bandit
      - name: Run bandit
        run: bandit -r bindings/python/ -ll || true
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp, python
      - name: Build for CodeQL
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON
          cmake --build build --config Debug
      - uses: github/codeql-action/analyze@v3
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  l3-review-label:
    name: Request L3 Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['L3-security-review', 'security']
            })
