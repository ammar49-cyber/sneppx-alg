name: CI — Dev Branch

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pre-commit system deps
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format shellcheck 2>&1 | tail -5
          npm install -g markdownlint-cli 2>&1 | tail -3
      - uses: pre-commit/action@v3.0.0
        continue-on-error: true

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps (required by CMake)
        shell: bash
        run: pip install numpy
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_PYTHON=ON
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }}

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy pytest pytest-timeout
      - name: Configure & Build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_PYTHON=ON
          cmake --build build --config Debug
      - name: ctest
        working-directory: build
        run: ctest -C Debug --output-on-failure
      - name: Python tests
        shell: bash
        run: |
          export PYTHONPATH="$PWD/bindings/python"
          python -m pytest tests/python/ -q --timeout=60 -x || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        shell: bash
        run: pip install numpy bandit
      - name: Run bandit
        run: bandit -r bindings/python/ -ll || true
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp, python
      - name: Build for CodeQL
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON
          cmake --build build --config Debug
      - uses: github/codeql-action/analyze@v3
