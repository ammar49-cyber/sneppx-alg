name: CI — Dev Branch

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
      - name: clang-tidy
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          run-clang-tidy -p build -quiet

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j$(nproc)

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_PYTHON=ON
          cmake --build build --config Debug -j$(nproc)
      - name: ctest
        working-directory: build
        run: ctest -C Debug --output-on-failure
      - name: Python tests
        shell: bash
        run: |
          export PYTHONPATH="$PWD/bindings/python"
          python -m pytest tests/python/ -q --timeout=60 -x

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with coverage
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON -DCMAKE_C_FLAGS="--coverage" -DCMAKE_CXX_FLAGS="--coverage"
          cmake --build build --config Debug -j$(nproc)
      - name: Run tests under coverage
        working-directory: build
        run: ctest -C Debug --output-on-failure
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: build
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bandit (Python)
        run: |
          pip install bandit
          bandit -r bindings/python/ -ll || true
      - name: Run CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          languages: cpp, python
