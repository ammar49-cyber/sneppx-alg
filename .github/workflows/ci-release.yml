name: CI — Release Branch

on:
  push:
    branches:
      - release/**
  pull_request:
    branches:
      - release/**
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
      - name: clang-tidy
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          run-clang-tidy -p build -quiet

  regression:
    name: Regression Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DSNEPPX_BUILD_TESTS=ON -DSNEPPX_BUILD_PYTHON=ON -DSNEPPX_BUILD_BENCHMARKS=ON `
            -DSNEPPX_USE_ASAN=ON -DSNEPPX_USE_UBSAN=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j$(nproc)
      - name: ctest
        working-directory: build
        run: ctest -C ${{ matrix.config }} --output-on-failure
      - name: Python tests
        shell: bash
        run: |
          export PYTHONPATH="$PWD/bindings/python"
          python -m pytest tests/python/ -v --timeout=60 -x

  coverage:
    name: Coverage Gate
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build with coverage
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSNEPPX_BUILD_TESTS=ON `
            -DCMAKE_C_FLAGS="--coverage" -DCMAKE_CXX_FLAGS="--coverage"
          cmake --build build --config Debug -j$(nproc)
      - name: Run tests
        working-directory: build
        run: ctest -C Debug --output-on-failure
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: build
          fail_ci_if_error: true

  security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r bindings/python/ -ll
      - name: Run CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          languages: cpp, python
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  package:
    name: Package Build
    needs: [regression, coverage, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python wheel & sdist
        run: |
          pip install build
          python -m build --wheel --sdist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
      - name: Verify install
        run: |
          pip install dist/*.whl
          python -c "from SneppX_ALG import Tensor; print('Release package OK')"
