name: CI — Release Branch

on:
  push:
    branches:
      - release/**
  pull_request:
    branches:
      - release/**
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.0

  regression:
    name: Regression Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure with sanitizers
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DSNEPPX_BUILD_TESTS=ON \
            -DSNEPPX_BUILD_PYTHON=ON \
            -DSNEPPX_BUILD_BENCHMARKS=ON
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }}
      - name: ctest
        working-directory: build
        run: ctest -C ${{ matrix.config }} --output-on-failure
      - name: Python tests
        shell: bash
        run: |
          pip install pytest pytest-timeout
          export PYTHONPATH="$PWD/bindings/python"
          python -m pytest tests/python/ -v --timeout=60 -x || true

  security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r bindings/python/ -ll || true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp, python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  package:
    name: Package Build
    needs: [regression, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Python wheel & sdist
        shell: bash
        run: |
          pip install build
          python -m build --wheel --sdist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
      - name: Verify install
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "from SneppX_ALG import Tensor; print('Release package OK')"
