site_name: SNEPPX-Algo
site_description: >
    Secure neural algorithm pipeline: HSS -> SER -> ARC -> NPE -> FM wrapped in
    10 security layers (S0-S9). Post-quantum crypto, distributed training
    (ZeRO/TP/PP/EP), quantization (INT8/INT4/FP8/AWQ/GPTQ), and a NumPy-fallback
    Python API.
site_author: Ammar [SNEPPX]
site_url: https://ammar49-cyber.github.io/sneppx-alg

repo_url: https://github.com/ammar49-cyber/sneppx-alg
repo_name: ammar49-cyber/sneppx-alg
edit_uri: edit/main/docs/

copyright: >
    Built with the SNEPPX-Algo documentation stack. Content licensed under the
    repository's MIT license.

extra:
    palette:
        - scheme: default
          primary: default
          accent: indigo
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - scheme: dark
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
    feature:
        navigation:
            top: true

theme:
    name: material
    icon:
        repo: fontawesome/brands/github
        menu: material/menu
        toc: material/list
        search: material/search
        close: material/close
    logo: logo.jpeg
    features:
        - navigation.expand
        - navigation.sections
        - navigation.tracking
        - search.suggest
        - search.highlight
        - content.code.annotate
        - content.code.copy
        - content.tooltips
        - navigation.path
        - navigation.top
        - search.share
        - back-to-top
    readme_file: false
    exclude_docs: README.md
plugins:
    - search
    - mike

markdown_extensions:
    - admonition
    - abbr
    - attr_list
    - md_in_html
    - footnotes
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                element: div
    - pymdownx.arithmatex:
          generic: true
          preview: true
    - pymdownx.betterem:
          smart_enable: []
    - pymdownx.magiclink:
          repo_url_shorthand: True
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.tilde
    - pymdownx.snippets:
          base_path: docs
    - toc:
          permalink: true
          separator: "&#702;"

nav:
    - Home: index.md
    - Quick Start: guide/quickstart.md
    - Architecture:
        - Pipeline Overview: architecture/5-pipeline-architecture.md
        - Security Layers (S0-S9): architecture/security_layers_s0s9.md
        - Distributed Training: architecture/distributed_training.md
        - Code Walkthroughs:
            - HSS: walkthrough-hss.md
            - SER: walkthrough-ser.md
            - ARC: walkthrough-arc.md
            - NPE: walkthrough-npe.md
            - FM: walkthrough-fm.md
    - Tutorials:
        - Tutorial Index: tutorials/index.md
        - Classification: tutorials/classification.md
        - Text Generation: tutorials/generation.md
        - RLHF Fine-Tuning: tutorials/fine_tuning_rlhf.md
        - Quantization + Serving: tutorials/quantization_serving.md
        - Distributed Training: tutorials/distributed_training.md
        - MoE Expert Routing: tutorials/moe_ser_routing.md
        - Security Scanning: tutorials/security_scanning.md
        - Profiling & Benchmarks: tutorials/profiling_benchmarks.md
        - Data Pipeline: tutorials/data_pipeline.md
        - Model Conversion: tutorials/model_conversion.md
    - API Reference:
        - Python API: api/python.md
        - C API: api/c.md
        - Doxygen (C/C++): api/index.md
    - Cookbook:
        - Overview: cookbook/index.md
        - Tensors: cookbook/tensors.md
        - Models & Layers: cookbook/models_layers.md
        - Training: cookbook/training.md
        - Optimizers: cookbook/optimizers.md
        - Quantization: cookbook/quantization.md
        - Distributed: cookbook/distributed.md
        - Serving & Inference: cookbook/serving.md
        - Data & Tokenization: cookbook/data_tokenization.md
        - Security: cookbook/security.md
        - Profiling: cookbook/profiling.md
        - Checkpointing: cookbook/checkpointing.md
        - Conversion: cookbook/conversion.md
        - Generation: cookbook/generation.md
    - Migration:
        - PyTorch: migration/from_pytorch.md
        - TensorFlow: migration/from_tensorflow.md
        - JAX: migration/from_jax.md
    - Guides:
        - SneppX Console: guides/sneppx_console.md
        - Installation: installation.md
    - Community: community/index.md
    - Learn:
        - Video Series: learn/videos.md
    - Changelog: changelog/index.md
    - FAQ: FAQ.md
    - Reference Docs:
