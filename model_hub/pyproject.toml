[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sneppx-hub"
version = "0.1.0"
description = "SNEPPX Model Hub — centralized model registry with search, versioning, and leaderboard"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ammar [SNEPPX]", email = "algoSNEPPX@gmail.com"},
]
keywords = [
    "ai", "machine-learning", "model-hub", "model-registry",
    "sneppx", "mlops", "model-sharing",
]

dependencies = [
    "numpy>=1.21.0",
    "pydantic>=2.0.0",
    "boto3>=1.26.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.100.0", "uvicorn>=0.22.0"]
cli = ["click>=8.0", "requests>=2.28.0", "rich>=13.0"]
hf = ["huggingface_hub>=0.16.0"]
torch = ["torch>=2.0.0"]
full = ["fastapi>=0.100.0", "uvicorn[standard]>=0.22.0", "click>=8.0", "requests>=2.28.0", "rich>=13.0", "huggingface_hub>=0.16.0"]

[project.scripts]
sneppx-hub = "model_hub.cli.main:main"

[tool.setuptools]
packages = [
    "model_hub",
    "model_hub.api",
    "model_hub.cli",
    "model_hub.converters",
    "model_hub.storage",
]

[tool.setuptools.package-dir]
"model_hub" = "."
"model_hub.api" = "api"
"model_hub.cli" = "cli"
"model_hub.converters" = "converters"
"model_hub.storage" = "storage"

[tool.setuptools.package-data]
model_hub = [
    "templates/*",
    "include/neural_core/*.h",
]
